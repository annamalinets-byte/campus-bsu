<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #fff; height: 100%; }
  img { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<img id="pic">
<script>
  const src = new URLSearchParams(location.search).get('src');
  document.getElementById('pic').src = src;
</script>
</body>
</html>
