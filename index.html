<title>Карта корпуса БГУ · Карла Маркса, 31</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f5f5f4; color: #1f2937;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  }

  /* ==== шапка с поиском ==== */
  .topbar { background: #fff; border-bottom: 1px solid #e7e5e4; padding: 10px 14px 10px; flex: none; }
  .title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .title-row h1 { margin: 0; font-size: 15px; font-weight: 700; flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title-row h1 small { display: block; font-size: 11px; font-weight: 400; color: #6b7280; }
  .icon-btn {
    flex: none; width: 34px; height: 34px; border-radius: 10px; border: 1.5px solid #d6d3d1;
    background: #fff; color: #44403c; font-size: 15px; cursor: pointer;
  }
  .icon-btn:hover { border-color: #2563eb; color: #1d4ed8; }

  .search { position: relative; }
  .search input {
    width: 100%; padding: 12px 14px; font-size: 16px; border: 1.5px solid #d6d3d1;
    border-radius: 12px; outline: none; background: #fff; color: #1f2937;
  }
  .search input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  .sug {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #fff;
    border: 1px solid #e7e5e4; border-radius: 12px; box-shadow: 0 10px 28px rgba(0,0,0,.14);
    max-height: min(46vh, 380px); overflow: auto; z-index: 40; display: none;
  }
  .sug.open { display: block; }
  .sug-item { padding: 10px 14px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .sug-item + .sug-item { border-top: 1px solid #f5f5f4; }
  .sug-item.active, .sug-item:hover { background: #eff6ff; }
  .sug-num { font-weight: 700; min-width: 46px; color: #1e3a8a; }
  .sug-name { flex: 1; font-size: 13px; color: #374151; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sug-floor { font-size: 11px; color: #6b7280; background: #f5f5f4; border-radius: 8px; padding: 2px 8px; flex: none; }
  .sug-empty { padding: 12px 14px; font-size: 13px; color: #6b7280; }

  /* ==== переключатель уровней ==== */
  .floors { display: flex; gap: 6px; padding: 8px 14px; background: #fff;
    border-bottom: 1px solid #e7e5e4; overflow-x: auto; flex: none; }
  .floor-btn {
    border: 1.5px solid #d6d3d1; background: #fff; color: #44403c; min-width: 44px;
    padding: 8px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .floor-btn:hover { border-color: #2563eb; color: #1d4ed8; }
  .floor-btn.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  .floor-btn.mezz { border-style: dashed; }
  .floor-btn.mezz.active { border-style: solid; }
  .floors .hint { font-size: 11px; color: #9ca3af; margin-left: auto; align-self: center;
    white-space: nowrap; padding-left: 8px; }

  /* ==== карта ==== */
  .map-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none;
    background: #fafaf9; }
  #map { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; -webkit-user-select: none; }
  #map.panning { cursor: grabbing; }
  #panzoom { transform-origin: 0 0; }
  .room { cursor: pointer; }
  .room .body { transition: opacity .25s; }
  .room:hover .body { stroke-width: 3.2; }
  #map.dimmed .room:not(.hl) { opacity: .38; }
  #map.dimmed .stair, #map.dimmed .level-outline, #map.dimmed .zone-label { opacity: .38; }
  .stair, .level-outline, .zone-label { transition: opacity .25s; }
  .hl-ring { fill: none; stroke: #f59e0b; stroke-width: 5; pointer-events: none;
    animation: hl-pulse 1.1s ease-in-out infinite; }
  @keyframes hl-pulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: .3; } }

  .map-tools { position: absolute; right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px; z-index: 20;
    transition: bottom .25s ease, top .25s ease; }
  /* на мобильном открытая нижняя карточка перекрывает низ карты — поднимаем кнопки */
  @media (max-width: 899px) {
    body.card-open .map-tools { bottom: auto; top: 10px; }
  }
  .tool-btn {
    width: 42px; height: 42px; border-radius: 12px; border: 1.5px solid #d6d3d1; background: #fff;
    color: #44403c; font-size: 19px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .tool-btn:hover { border-color: #2563eb; color: #1d4ed8; }

  /* ==== карточка (mobile: нижняя шторка, desktop: панель справа) ==== */
  .card {
    position: absolute; left: 0; right: 0; bottom: 0; background: #fff; z-index: 30;
    border-radius: 16px 16px 0 0; box-shadow: 0 -6px 28px rgba(0,0,0,.14);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .25s ease;
    touch-action: pan-y;
  }
  .card.open { transform: none; }
  .card-close {
    position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 9px;
    border: none; background: #f5f5f4; color: #57534e; font-size: 14px; cursor: pointer;
  }
  .card-num { font-size: 26px; font-weight: 800; color: #1e3a8a; line-height: 1.1; }
  .card h2 { margin: 2px 0 10px; font-size: 15px; font-weight: 600; color: #1f2937; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .badge { font-size: 11.5px; padding: 3px 10px; border-radius: 999px; background: #f5f5f4; color: #44403c;
    border: 1px solid #e7e5e4; }
  .card .howto { font-size: 13.5px; color: #374151; margin: 0 0 8px; line-height: 1.5; }
  .card .note { font-size: 12px; color: #78716c; margin: 0; line-height: 1.5; }
  .card .legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #e7e5e4;
    padding: 4px 10px; border-radius: 999px; font-size: 12px; color: #44403c; }
  .chip i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }

  .route-box { margin-top: 2px; padding-top: 10px; border-top: 1px dashed #e7e5e4; }
  .route-btn { width: 100%; padding: 10px; border: 1.5px solid #2563eb; background: #eff6ff; color: #1d4ed8;
    border-radius: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .route-btn:hover { background: #dbeafe; }

  @media (min-width: 900px) {
    .topbar { padding: 14px 24px; }
    .title-row h1 { font-size: 18px; }
    .floors { padding: 10px 24px; }
    .card {
      left: auto; right: 16px; bottom: auto; top: 16px; width: 380px; max-width: calc(100% - 32px);
      border-radius: 14px; box-shadow: 0 10px 32px rgba(0,0,0,.16);
      transform: translateY(-10px); opacity: 0; pointer-events: none;
      transition: transform .2s ease, opacity .2s ease; max-height: calc(100% - 32px); overflow: auto;
    }
    .card.open { transform: none; opacity: 1; pointer-events: auto; }
  }
</style>

<header class="topbar">
  <div class="title-row">
    <h1>Корпус БГУ · Карла Маркса, 31
      <small>Главный корпус · метро «Купаловская» · этажи 1–5</small>
    </h1>
    <button class="icon-btn" id="legendBtn" aria-label="Обозначения и управление" title="Обозначения и управление">ⓘ</button>
  </div>

<nav class="floors" id="floors" aria-label="Выбор уровня"></nav>

<main class="map-wrap" id="mapWrap">

    <button class="tool-btn" id="zoomIn" aria-label="Приблизить">+</button>

    <button class="tool-btn" id="zoomReset" aria-label="Показать весь этаж">⤢</button>
  </div>
  <aside class="card" id="card" aria-live="polite"></aside>
</main>

<script>

  var LEVELS = DATA.levels;

  var W = 1240, H = 680;

  var TYPE_COLORS = {
    auditorium: { fill: '#dbeafe', stroke: '#2563eb', text: '#1e3a8a' },

    entrance:   { fill: '#f3f4f6', stroke: '#6b7280', text: '#374151' }
  };
  var TYPE_LABELS = {
    auditorium: 'аудитория', department: 'кафедра', deanery: 'деканат',
    library: 'библиотека', hall: 'актовый зал', lab: 'лаборатория',
    office: 'офис / служебное', food: 'фудкорт', wc: 'туалет',
    sport: 'спортзал', wardrobe: 'гардероб / раздевалка',
    turnstile: 'турникеты', yard: 'дворик', entrance: 'вход / вахта'
  };

  /* ================= состояние ================= */
  var state = { level: LEVELS[0].id, selected: null };
  var view = { k: 1, x: 0, y: 0 };
  var animId = null;
  var LV = null;                  // текущий уровень
  var T = { s: 1, ox: 0, oy: 0 }; // преобразование PDF-координат уровня → viewBox
  var rectOf = {};                // id комнаты → прямоугольник в координатах viewBox

  var svg = document.getElementById('map');
  var mapWrap = document.getElementById('mapWrap');
  var panzoom = null;

  /* ================= утилиты ================= */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function clip(text, maxChars) {
    return text.length > maxChars ? text.slice(0, Math.max(1, maxChars - 1)) + '…' : text;
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function levelById(id) {
    return LEVELS.find(function (l) { return l.id === id; });
  }
  function allRooms() {
    var out = [];
    LEVELS.forEach(function (l) {
      l.rooms.forEach(function (r) { out.push(r); });
    });
    return out;
  }
  function roomById(id) {
    return allRooms().find(function (r) { return r.id === id || r.number === id; });
  }
  function levelOf(room) { return levelById(room.floor != null ? room.floor : room._lvl); }
  function displayNum(r) {
    if (/^WC/.test(r.number)) return 'WC';
    if (r.number === 'ACT') return 'АКТ';
    if (r.type === 'entrance' || r.type === 'wardrobe' || r.type === 'turnstile' ||
        r.type === 'yard' || r.type === 'sport' || r.type === 'hall' || r.type === 'food') return '';
    if (r.number === 'ДЕК' || r.number === 'КАФ') return '';
    return r.number;
  }

  /* нормализация поискового ввода: латиница→кириллица, ё→е, отброс мусора */
  var LATIN_TO_CYR = { A: 'А', B: 'В', C: 'С', E: 'Е', H: 'Н', K: 'К', M: 'М', O: 'О', P: 'Р', T: 'Т', X: 'Х', Y: 'У' };
  function norm(s) {
    return String(s).toUpperCase()
      .replace(/Ё/g, 'Е')
      .replace(/[A-Z]/g, function (c) { return LATIN_TO_CYR[c] || c; })
      .replace(/[^0-9А-Я]/g, '');
  }
  function searchQuery(raw) {
    return norm(raw).replace(/^(АУДИТОРИЯ|АУД|КАБИНЕТ|КАБ|К)(?=\d)/, '');
  }

  /* ================= отрисовка уровня ================= */
  function renderLevel() {
    LV = levelById(state.level);
    rectOf = {};
    var r = LV.region, rw = r[2] - r[0], rh = r[3] - r[1];
    var s = Math.min(1140 / rw, 500 / rh);
    T = { s: s, ox: (W - rw * s) / 2 - r[0] * s, oy: 130 + (520 - rh * s) / 2 - r[1] * s };

    var s2 =
      '<g id="panzoom">' +
      '<text x="40" y="42" font-size="19" font-weight="700" fill="#111827">Карла Маркса, 31 — ' + esc(LV.title.toLowerCase()) + '</text>' +
      '<text x="40" y="62" font-size="11" fill="#a8a29e">' +
        (LV.mezz ? 'полуэтаж между ' + Math.floor(LV.id) + ' и ' + (Math.floor(LV.id) + 1) + ' этажами' : 'основной этаж') +

      '<g id="levelg" transform="translate(' + T.ox.toFixed(1) + ',' + T.oy.toFixed(1) + ') scale(' + s.toFixed(4) + ')">' +
      '<path class="level-outline" d="' + LV.outline + '" fill="#ffffff" stroke="#111827" stroke-width="45" stroke-linejoin="round"/>';

    // лестницы
    (LV.stairs || []).forEach(function (st) {
      var lines = '';
      var n = Math.round(st.h / 130);
      for (var i = 1; i < n; i++) {
        var ly = st.y + i * (st.h / n);
        lines += '<line x1="' + (st.x + 50) + '" y1="' + ly + '" x2="' + (st.x + st.w - 50) + '" y2="' + ly + '" stroke="#9ca3af" stroke-width="30"/>';
      }
      s2 += '<g class="stair">' +
        '<rect x="' + st.x + '" y="' + st.y + '" width="' + st.w + '" height="' + st.h + '" rx="30" fill="#e5e7eb" stroke="#9ca3af" stroke-width="24"/>' +
        lines +
        (st.label ? '<text x="' + (st.x + st.w / 2) + '" y="' + (st.y + st.h + 150) + '" text-anchor="middle" font-size="130" fill="#6b7280">' + esc(st.label) + '</text>' : '') +
        '</g>';
    });

    // зонные надписи (ФИЛФАК и т.п.)
    (LV.zoneLabels || []).forEach(function (z) {
      s2 += '<text class="zone-label" x="' + z.x + '" y="' + z.y + '" text-anchor="middle" font-size="' + (z.size || 500) + '" font-weight="700" fill="#a8a29e" opacity="0.55">' + esc(z.text) + '</text>';
    });

    // комнаты
    LV.rooms.forEach(function (room) {
      room._lvl = LV.id;
      var c = TYPE_COLORS[room.type] || TYPE_COLORS.office;
      var x = room.cx - room.w / 2, y = room.cy - room.h / 2;
      rectOf[room.id] = {
        x: x * T.s + T.ox, y: y * T.s + T.oy,
        w: room.w * T.s, h: room.h * T.s
      };
      var dashed = room.conf === 'hypothesis' ? ' stroke-dasharray="70 45"' : '';
      var num = displayNum(room);
      var maxChars = Math.max(6, Math.floor((room.w - 90) / 95));
      var label = clip(room.name, maxChars);
      var numY = room.h > room.w ? room.cy - 60 : room.cy - 40;
      s2 += '<g class="room" data-room="' + esc(room.id) + '">' +
        '<rect class="body" x="' + x + '" y="' + y + '" width="' + room.w + '" height="' + room.h + '" rx="55" fill="' + c.fill + '" stroke="' + c.stroke + '" stroke-width="28"' + dashed + '/>' +
        (num ? '<text x="' + room.cx + '" y="' + numY + '" text-anchor="middle" font-size="250" font-weight="700" fill="' + c.text + '">' + esc(num) + '</text>' : '') +
        '<text x="' + room.cx + '" y="' + (num ? numY + 210 : room.cy + 60) + '" text-anchor="middle" font-size="135" fill="' + c.text + '">' + esc(label) + '</text>' +
        '</g>';
    });

    s2 += '</g></g>';
    svg.innerHTML = s2;
    panzoom = document.getElementById('panzoom');
    svg.setAttribute('aria-label', 'Схема: ' + LV.title + ' корпуса');
    renderView();
    if (state.selected && levelOf(state.selected).id === state.level) highlight(state.selected);
  }

  /* ================= пан/зум ================= */
  function renderView() {
    if (panzoom) panzoom.style.transform = 'translate(' + view.x + 'px, ' + view.y + 'px) scale(' + view.k + ')';
  }
  function cancelAnim() { if (animId) { cancelAnimationFrame(animId); animId = null; } }
  function animateTo(target, dur) {
    cancelAnim();
    dur = dur || 480;
    var start = { k: view.k, x: view.x, y: view.y };
    var t0 = performance.now();
    function frame(t) {
      var u = clamp((t - t0) / dur, 0, 1);
      var e = 1 - Math.pow(1 - u, 3);
      view.k = start.k + (target.k - start.k) * e;
      view.x = start.x + (target.x - start.x) * e;
      view.y = start.y + (target.y - start.y) * e;
      renderView();
      if (u < 1) animId = requestAnimationFrame(frame); else animId = null;
    }
    animId = requestAnimationFrame(frame);
  }
  function fitView() { return { k: 1, x: 0, y: 0 }; }
  function focusRect(rc) {
    var k = clamp(760 / Math.max(rc.w, rc.h * 1.7), 1.4, 3.2);
    var cx = rc.x + rc.w / 2, cy = rc.y + rc.h / 2;
    animateTo({ k: k, x: W / 2 - cx * k, y: H / 2 - cy * k });
  }
  function svgPointFromClient(cx, cy) {
    var m = svg.getScreenCTM();
    if (!m) return { x: 0, y: 0 };
    var inv = m.inverse();
    return { x: cx * inv.a + cy * inv.c + inv.e, y: cx * inv.b + cy * inv.d + inv.f };
  }
  function zoomAtPoint(p, k2) {
    k2 = clamp(k2, 0.6, 6);
    view.x = p.x - (p.x - view.x) * k2 / view.k;
    view.y = p.y - (p.y - view.y) * k2 / view.k;
    view.k = k2;
    renderView();
  }

  var ptrs = new Map();
  var pinchPrev = null;
  var movedUnits = 0;

  function overUi(e) {
    return !!(e.target.closest && e.target.closest('.map-tools, .card'));
  }
  mapWrap.addEventListener('pointerdown', function (e) {
    if (overUi(e)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) { movedUnits = 0; svg.classList.add('panning'); }
    if (ptrs.size === 2) pinchPrev = pinchInfo();
    cancelAnim();
  });
  function pinchInfo() {
    var a = Array.from(ptrs.values());
    return { d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1, mx: (a[0].x + a[1].x) / 2, my: (a[0].y + a[1].y) / 2 };
  }
  window.addEventListener('pointermove', function (e) {
    if (!ptrs.has(e.pointerId)) return;
    var prev = ptrs.get(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    var m = svg.getScreenCTM();
    var pxPerUnit = m ? m.a : 1;
    if (ptrs.size === 1) {
      var dx = (e.clientX - prev.x) / pxPerUnit, dy = (e.clientY - prev.y) / pxPerUnit;
      view.x += dx; view.y += dy;
      movedUnits += Math.abs(dx) + Math.abs(dy);
      renderView();
    } else if (ptrs.size === 2 && pinchPrev) {
      var now = pinchInfo();
      var p = svgPointFromClient(now.mx, now.my);
      zoomAtPoint(p, view.k * now.d / pinchPrev.d);
      view.x += (now.mx - pinchPrev.mx) / pxPerUnit;
      view.y += (now.my - pinchPrev.my) / pxPerUnit;
      renderView();
      movedUnits += 10;
      pinchPrev = now;
    }
  });
  function onPointerEnd(e) {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinchPrev = null;
    if (ptrs.size === 0) svg.classList.remove('panning');
  }
  window.addEventListener('pointerup', onPointerEnd);
  window.addEventListener('pointercancel', onPointerEnd);
  window.addEventListener('blur', function () { ptrs.clear(); pinchPrev = null; svg.classList.remove('panning'); });

  // Тачпад-управление (как на картах): перетаскивание — панорама; прокрутка двумя
  // пальцами — перемещение карты; щипок (Ctrl + прокрутка) или колесо с Ctrl — зум к курсору
  mapWrap.addEventListener('wheel', function (e) {
    if (overUi(e)) return;
    e.preventDefault();
    cancelAnim();
    if (e.ctrlKey || e.metaKey) {
      var p = svgPointFromClient(e.clientX, e.clientY);
      var f = Math.exp(-e.deltaY * 0.01);
      zoomAtPoint(p, view.k * clamp(f, 0.85, 1.18));
    } else {
      var m = svg.getScreenCTM();
      var u = m ? 1 / m.a : 1;
      view.x -= e.deltaX * u;
      view.y -= e.deltaY * u;
      renderView();
    }
  }, { passive: false });

  svg.addEventListener('dblclick', function (e) {
    e.preventDefault();
    cancelAnim();
    zoomAtPoint(svgPointFromClient(e.clientX, e.clientY), view.k * 1.6);
  });

  document.getElementById('zoomIn').addEventListener('click', function () {
    cancelAnim(); zoomAtPoint({ x: W / 2, y: H / 2 }, view.k * 1.35);
  });
  document.getElementById('zoomOut').addEventListener('click', function () {
    cancelAnim(); zoomAtPoint({ x: W / 2, y: H / 2 }, view.k / 1.35);
  });
  document.getElementById('zoomReset').addEventListener('click', function () { animateTo(fitView()); });

  svg.addEventListener('click', function (e) {
    if (movedUnits > 6) { movedUnits = 0; return; }
    var g = e.target.closest ? e.target.closest('[data-room]') : null;
    if (g) {
      var r = roomById(g.getAttribute('data-room'));
      if (r) { selectRoom(r); return; }
    }
    if (state.selected) clearSelection();
  });

  /* ================= подсветка и выбор ================= */
  function highlight(room) {
    svg.classList.add('dimmed');
    var g = svg.querySelector('[data-room="' + CSS.escape(room.id) + '"]');
    if (g) g.classList.add('hl');
    var rc = rectOf[room.id];
    var old = svg.querySelector('.hl-ring');
    if (old) old.remove();
    if (rc) {
      var ring = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      ring.setAttribute('class', 'hl-ring');
      ring.setAttribute('x', rc.x - 6); ring.setAttribute('y', rc.y - 6);
      ring.setAttribute('width', rc.w + 12); ring.setAttribute('height', rc.h + 12);
      ring.setAttribute('rx', 10);
      panzoom.appendChild(ring);
    }
  }
  function clearHighlight() {
    svg.classList.remove('dimmed');
    var g = svg.querySelector('.hl'); if (g) g.classList.remove('hl');
    var ring = svg.querySelector('.hl-ring'); if (ring) ring.remove();
  }

  function selectRoom(room, opts) {
    opts = opts || {};
    stopRoute();
    state.selected = room;
    if (levelOf(room).id !== state.level) {
      state.level = levelOf(room).id;
      updateFloorBtns();
      renderLevel();
    } else {
      highlight(room);
    }
    var rc = rectOf[room.id];
    if (rc) focusRect(rc);
    showRoomCard(room);
    if (!opts.noHash) {
      try { history.replaceState(null, '', '#room=' + encodeURIComponent(room.number)); } catch (err) { /* file:// может запрещать */ }
    }
  }
  function clearSelection(opts) {
    opts = opts || {};
    stopRoute();
    state.selected = null;
    clearHighlight();
    closeCard();
    animateTo(fitView());
    if (!opts.noHash) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (err) { /* ignore */ }
    }
  }

  /* ================= уровни (кнопки) ================= */
  var floorsNav = document.getElementById('floors');
  function buildFloorBtns() {
    floorsNav.innerHTML = '';
    LEVELS.forEach(function (lv) {
      var b = document.createElement('button');
      b.className = 'floor-btn' + (lv.mezz ? ' mezz' : '') + (lv.id === state.level ? ' active' : '');
      b.textContent = lv.short;
      b.dataset.level = String(lv.id);
      b.setAttribute('aria-label', lv.title);
      b.title = lv.title;
      b.addEventListener('click', function () {
        if (state.level === lv.id) { animateTo(fitView()); return; }
        state.level = lv.id;
        state.selected = null;
        clearHighlight();
        updateFloorBtns();
        renderLevel();
        animateTo(fitView());
        closeCard();
      });
      floorsNav.appendChild(b);
    });
    var hint = document.createElement('span');
    hint.className = 'hint';
    hint.textContent = 'главный корпус · этажи';
    floorsNav.appendChild(hint);
  }
  function updateFloorBtns() {
    floorsNav.querySelectorAll('.floor-btn').forEach(function (b) {
      b.classList.toggle('active', Number(b.dataset.level) === state.level);
    });
  }

  /* ================= карточка ================= */
  var card = document.getElementById('card');
  function syncCardClass() {
    document.body.classList.toggle('card-open', card.classList.contains('open'));
  }
  function closeCard() { card.classList.remove('open'); syncCardClass(); }

  function levelName(lv) {
    return lv.mezz
      ? lv.title.toLowerCase() + ' (между ' + Math.floor(lv.id) + ' и ' + (Math.floor(lv.id) + 1) + ')'
      : lv.title.toLowerCase();
  }
  function howToFind(room) {
    var lv = levelOf(room);
    var r = lv.region, cx = (r[0] + r[2]) / 2, cy = (r[1] + r[3]) / 2;
    if (room.type === 'entrance' && room.id === 'GUARD') return '1 этаж · главный вход с ул. Карла Маркса';
    var parts = [levelName(lv)];
    var nx = (room.cx - r[0]) / (r[2] - r[0]), ny = (room.cy - r[1]) / (r[3] - r[1]);
    if (Math.abs(nx - 0.5) > Math.abs(ny - 0.5)) parts.push(nx < 0.5 ? 'левая часть схемы' : 'правая часть схемы');
    else parts.push(ny < 0.5 ? 'дальняя часть схемы' : 'ближняя часть схемы');
    var best = null, bd = Infinity;
    (lv.stairs || []).forEach(function (st) {
      var d = (st.x - room.cx) * (st.x - room.cx) + (st.y - room.cy) * (st.y - room.cy);
      if (d < bd) { bd = d; best = st; }
    });
    if (best) parts.push(best.x < cx ? 'ближе к лестнице слева' : 'ближе к лестнице справа');
    return parts.join(' · ');
  }

  /* ============ маршрут от входа (облегчённый, v1) ============ */
  var SVGNS = 'http://www.w3.org/2000/svg';
  function stairIsCell(st) { return st.label === 'лестничная клетка'; }
  function stairSide(st, lv) {
    return st.x < (lv.region[0] + lv.region[2]) / 2 ? 'left' : 'right';
  }
  function mainStairs(lv) {
    return (lv.stairs || []).filter(function (s) { return !stairIsCell(s); });
  }
  function stairBySide(lv, side) {
    var found = null;
    mainStairs(lv).forEach(function (st) { if (stairSide(st, lv) === side) found = st; });
    return found;
  }
  function nearestMainStair(room) {
    var lv = levelOf(room), best = null, bd = Infinity;
    mainStairs(lv).forEach(function (st) {
      var d = (st.x - room.cx) * (st.x - room.cx) + (st.y - room.cy) * (st.y - room.cy);
      if (d < bd) { bd = d; best = st; }
    });
    return best;
  }
  /* тип маршрута: тот же этаж | главный корпус | правый коридорчик | вторая часть кампуса */
  function routeKind(room) {
    if (levelOf(room).id === 1) return 'same';
    if (/^WING_/.test(room.id)) return 'wing';
    if (/^NB_/.test(room.id)) return 'nb';
    return 'main';
  }
  function routeSteps(room) {
    var lv = levelOf(room), lv1 = levelById(1);
    var entry = { level: 1, roomId: 'ENTRY', label: 'Главный вход с ул. Карла Маркса (1 этаж)' };
    var kind = routeKind(room);
    if (kind === 'same') return [entry, { level: 1, roomId: room.id, label: room.name }];
    if (kind === 'wing' || kind === 'nb') {
      var steps = [entry,
        { level: 1, stair: stairBySide(lv1, 'right'), label: 'Правая лестница — наверх' },
        { level: lv.id, stair: stairBySide(lv, 'right'), label: lv.id + '-й этаж, правая лестница' }];
      if (kind === 'wing') {
        steps.push({ level: lv.id, roomId: room.id, label: room.name });
      } else {
        steps.push(
          { level: lv.id, stair: (lv.stairs || []).filter(stairIsCell)[0], label: 'По коридорчику — до лестничной клетки второй части кампуса' },
          { level: lv.id, roomId: room.id, label: room.name });
      }
      return steps;
    }
    var st = nearestMainStair(room);
    var side = stairSide(st, lv);
    return [entry,
      { level: 1, stair: stairBySide(lv1, side), label: (side === 'left' ? 'Левая' : 'Правая') + ' лестница — наверх' },
      { level: lv.id, stair: st, label: lv.id + '-й этаж' },
      { level: lv.id, roomId: room.id, label: room.name }];
  }
  function routeText(room) {
    var kind = routeKind(room), lv = levelOf(room);
    if (kind === 'same') return 'главный вход и цель — на этом же 1-м этаже';
    if (kind === 'main') {
      var side = stairSide(nearestMainStair(room), lv) === 'left' ? 'левая' : 'правая';
      return 'вход (1 эт.) → ' + side + ' лестница → ' + lv.id + '-й этаж → цель';
    }
    if (kind === 'wing') return 'вход (1 эт.) → правая лестница → ' + lv.id + '-й этаж → правый коридорчик («окна во двор») → аудитория';
    return 'вход (1 эт.) → правая лестница → ' + lv.id + '-й этаж → коридорчик до конца → вторая часть кампуса → аудитория';
  }
  var routeTimers = [];
  function stopRoute() { routeTimers.forEach(function (t) { clearTimeout(t); }); routeTimers = []; }
  function flashRect(rc) {
    var old = svg.querySelectorAll('.hl-ring');
    for (var i = 0; i < old.length; i++) old[i].remove();
    var ring = document.createElementNS(SVGNS, 'rect');
    ring.setAttribute('class', 'hl-ring');
    ring.setAttribute('x', rc.x - 6); ring.setAttribute('y', rc.y - 6);
    ring.setAttribute('width', rc.w + 12); ring.setAttribute('height', rc.h + 12);
    ring.setAttribute('rx', 10);
    panzoom.appendChild(ring);
  }
  function playRoute(room) {
    stopRoute();
    closeCard();
    var steps = routeSteps(room);
    steps.forEach(function (st, i) {
      routeTimers.push(setTimeout(function () {
        if (state.level !== st.level) {
          state.level = st.level; state.selected = null;
          updateFloorBtns(); renderLevel();
        }
        if (st.roomId) {
          var r = roomById(st.roomId);
          highlight(r);
          var rc = rectOf[st.roomId];
          if (rc) focusRect(rc);
        } else if (st.stair) {
          var s = st.stair;
          var rc2 = { x: s.x * T.s + T.ox, y: s.y * T.s + T.oy, w: s.w * T.s, h: s.h * T.s };
          flashRect(rc2);
          var k = clamp(700 / Math.max(rc2.w, rc2.h), 1.2, 2.6);
          animateTo({ k: k, x: W / 2 - (rc2.x + rc2.w / 2) * k, y: H / 2 - (rc2.y + rc2.h / 2) * k });
        }
      }, i * 1600));
    });
    routeTimers.push(setTimeout(function () {
      selectRoom(room, { noHash: true });
      card.dataset.mode = 'room';
    }, steps.length * 1600));
  }

  function showRoomCard(room) {
    var lv = levelOf(room);
    var confLabel = DATA.confLabels[room.conf] || DATA.confLabels.hypothesis;
    var confColor = room.conf === 'stand' ? '#059669' : room.conf === 'official' ? '#2563eb' : '#d97706';
    var badges =
      '<span class="badge">' + esc(levelName(lv)) + '</span>' +
      '<span class="badge">' + esc(TYPE_LABELS[room.type] || room.type) + '</span>' +
      '<span class="badge" style="color:' + confColor + '; border-color:' + confColor + '40">' + confLabel + '</span>';
    var num = displayNum(room) || (room.number && !/^(WC|ТУРН|ДЕК|КАФ|ВХОД)/.test(room.number) ? room.number : '');
    card.innerHTML =
      '<button class="card-close" aria-label="Закрыть">✕</button>' +
      (num ? '<div class="card-num">' + esc(num) + '</div>' : '') +
      '<h2>' + esc(room.name) + '</h2>' +
      '<div class="badges">' + badges + '</div>' +
      '<p class="howto"><strong>Как найти:</strong> ' + esc(howToFind(room)) + '</p>' +
      (room.id !== 'ENTRY'
        ? '<div class="route-box">' +
          '<p class="howto"><strong>От входа:</strong> ' + esc(routeText(room)) + '</p>' +
          '<button class="route-btn" id="routeBtn">▶&nbsp;Показать путь на карте</button>' +
          '</div>'
        : '') +
      (room.conf === 'hypothesis'
        ? '<p class="note">Позиция на схеме приблизительная: номер известен из расписаний ЭФ, размещён рядом с родственными номерами. Уточните на месте.</p>'
        : '');
    card.classList.add('open');
    syncCardClass();
    card.querySelector('.card-close').addEventListener('click', function () { clearSelection(); });
    var routeBtn = card.querySelector('#routeBtn');
    if (routeBtn) routeBtn.addEventListener('click', function () { playRoute(room); });
  }
  function showAboutCard() {
    var chips = Object.keys(TYPE_COLORS).map(function (t) {
      var c = TYPE_COLORS[t];
      return '<span class="chip"><i style="background:' + c.fill + '; border:1.5px solid ' + c.stroke + '"></i>' + TYPE_LABELS[t] + '</span>';
    }).join('');
    card.innerHTML =
      '<button class="card-close" aria-label="Закрыть">✕</button>' +
      '<h2>Обозначения</h2>' +
      '<div class="legend">' + chips + '</div>' +
      '<p class="note"><strong>Размечены этажи 1–5 главного корпуса.</strong> Вход с ул. Карла Маркса — низ схемы 1 этажа, по центру. На этажах 2–4 к корпусу сверху примыкает правый коридорчик (лента с «окнами во двор» и аудитории 202–212, 303–308, 404/407); за ним — вторая часть кампуса (этаж 2: ауд. 214–225). Этажи 2–3 главного корпуса — филфак, детализация позже.</p>' +
      '<p class="note" style="margin-top:8px">Управление: перетаскивание — панорама; на тачпаде прокрутка — перемещение карты, щипок (или Ctrl + прокрутка) — масштаб; кнопки +/− и двойной клик — тоже зум. Комнату можно найти поиском или кликнуть по ней.</p>';
    card.classList.add('open');
    syncCardClass();
    card.querySelector('.card-close').addEventListener('click', closeCard);
  }
  document.getElementById('legendBtn').addEventListener('click', function () {
    if (card.classList.contains('open') && card.dataset.mode === 'about') closeCard();
    else { card.dataset.mode = 'about'; showAboutCard(); }
  });

  /* ================= поиск ================= */
  var input = document.getElementById('searchInput');
  var sug = document.getElementById('sug');
  var sugItems = [], sugActive = -1;

  /* синонимы: «туалет»/«столовая»/«спортзал»… → тип или конкретные комнаты */
  var POI_ALIASES = [
    { words: ['ТУАЛЕТ', 'WC', 'СОРТИР', 'УБОРНАЯ'], type: 'wc' },
    { words: ['СТОЛОВАЯ', 'ФУДКОРТ', 'ЕДА', 'ПОЕСТЬ', 'КАФЕ', 'КОФЕ', 'БУФЕТ'], type: 'food' },
    { words: ['БИБЛИОТЕКА', 'КНИГИ', 'АБОНЕМЕНТ', 'ЧИТАЛЬНЯ'], type: 'library' },
    { words: ['ГАРДЕРОБ', 'КУРТКА', 'РАЗДЕВАЛКА'], type: 'wardrobe' },
    { words: ['СПОРТЗАЛ', 'СПОРТ', 'ФИЗРА'], type: 'sport' },
    { words: ['ДЕКАНАТ'], type: 'deanery' },
    { words: ['ФИЛФАК', 'ФИЛОЛОГИЯ'], type: 'department' },
    { words: ['ТУРНИКЕТ'], type: 'turnstile' },
    { words: ['ВХОД'], ids: ['ENTRY'] },
    { words: ['ДВОРИК', 'ДВОР', 'ВЫХОД'], ids: ['EXIT15'] },
    { words: ['ВАХТА', 'ОХРАНА'], ids: ['GUARD'] },
    { words: ['АКТОВЫЙ', 'АКТ'], ids: ['ACT'] }
  ];
  function matchAlias(q) {
    for (var i = 0; i < POI_ALIASES.length; i++) {
      var ws = POI_ALIASES[i].words;
      for (var j = 0; j < ws.length; j++) {
        if (ws[j].indexOf(q) === 0 || q.indexOf(ws[j]) === 0) return POI_ALIASES[i];
      }
    }
    return null;
  }
  /* расстояние Левенштейна — для опечаток в номерах аудиторий */
  function lev(a, b) {
    if (Math.abs(a.length - b.length) > 1) return 2;
    var prev = [], cur;
    for (var j = 0; j <= b.length; j++) prev[j] = j;
    for (var i = 1; i <= a.length; i++) {
      cur = [i];
      for (var k = 1; k <= b.length; k++) {
        cur[k] = Math.min(prev[k] + 1, cur[k - 1] + 1,
          prev[k - 1] + (a.charAt(i - 1) === b.charAt(k - 1) ? 0 : 1));
      }
      prev = cur;
    }
    return prev[b.length];
  }

  function searchRooms(q) {
    var alias = matchAlias(q);
    var wcGender = /[Ж]$/.test(q) ? 'Ж' : /[М]$/.test(q) ? 'М' : '';
    var wcFloor = (q.match(/\d/) || [])[0];
    var scored = [];
    allRooms().forEach(function (r) {
      var n = norm(r.number), nm = norm(r.name), ty = norm(TYPE_LABELS[r.type] || '');
      var score = 0;
      if (n === q) score = 100;
      else if (q && n.startsWith(q)) score = 80 - Math.min(20, n.length);
      else if (q.length >= 3 && nm.includes(q)) score = 50;
      else if (q.length >= 3 && ty.includes(q)) score = 30;
      if (alias && !score) {
        var ok = alias.ids ? alias.ids.indexOf(r.id) >= 0 : r.type === alias.type;
        if (ok && alias.type === 'wc') {
          if (wcGender && !n.endsWith(wcGender)) ok = false;
          if (wcFloor && String(levelOf(r).id) !== wcFloor) ok = false;
        }
        if (ok) score = 60;
      }
      if (score) scored.push([score, r]);
    });
    // опечатка в номере: если точных совпадений нет — номер с расстоянием ≤ 1
    if (!scored.length && q.length >= 2) {
      allRooms().forEach(function (r) {
        var n = norm(r.number);
        if (n.length >= 2 && lev(q, n) <= 1) scored.push([35, r]);
      });
    }
    scored.sort(function (a, b) { return b[0] - a[0]; });
    return scored.slice(0, 8).map(function (x) { return x[1]; });
  }
  function closeSug() {
    sug.classList.remove('open');
    sug.innerHTML = '';
    sugItems = []; sugActive = -1;
    input.setAttribute('aria-expanded', 'false');
  }
  function renderSug(list) {
    sugItems = list; sugActive = -1;
    if (!list.length) {
      sug.innerHTML = '<div class="sug-empty">Ничего не найдено. Попробуйте номер (63А, 316) или слово («деканат», «фудкорт», «туалет», «спортзал»).</div>';
    } else {
      sug.innerHTML = list.map(function (r, i) {
        var lv = levelOf(r);
        return '<div class="sug-item" role="option" data-i="' + i + '">' +
          '<span class="sug-num">' + esc(displayNum(r) || TYPE_LABELS[r.type] || '•') + '</span>' +
          '<span class="sug-name">' + esc(r.name) + '</span>' +
          '<span class="sug-floor">' + lv.short + ' эт</span>' +
          '</div>';
      }).join('');
    }
    sug.classList.add('open');
    input.setAttribute('aria-expanded', 'true');
  }
  function markActive() {
    sug.querySelectorAll('.sug-item').forEach(function (el, i) {
      el.classList.toggle('active', i === sugActive);
    });
  }
  function choose(room) {
    closeSug();
    input.blur();
    selectRoom(room);
    card.dataset.mode = 'room';
  }

  input.addEventListener('input', function () {
    var q = searchQuery(input.value);
    if (!q) { closeSug(); return; }
    renderSug(searchRooms(q));
  });
  input.addEventListener('focus', function () {
    var q = searchQuery(input.value);
    if (q) renderSug(searchRooms(q));
  });
  input.addEventListener('keydown', function (e) {
    if (!sug.classList.contains('open')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!sugItems.length) return;
      sugActive = e.key === 'ArrowDown'
        ? (sugActive + 1) % sugItems.length
        : (sugActive - 1 + sugItems.length) % sugItems.length;
      markActive();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      var room = sugActive >= 0 ? sugItems[sugActive] : byExact(input.value) || sugItems[0];
      if (room) choose(room);
    } else if (e.key === 'Escape') {
      closeSug();
    }
  });
  function byExact(raw) {
    var q = searchQuery(raw);
    return allRooms().find(function (r) { return norm(r.number) === q; });
  }
  // Мышь: выбор по click (элемент доживает до конца клика); тач: по pointerdown
  sug.addEventListener('pointerdown', function (e) {
    var item = e.target.closest('.sug-item');
    if (item && e.pointerType === 'touch') {
      e.preventDefault();
      choose(sugItems[Number(item.dataset.i)]);
    }
  });
  sug.addEventListener('click', function (e) {
    var item = e.target.closest('.sug-item');
    if (item) choose(sugItems[Number(item.dataset.i)]);
  });
  document.addEventListener('pointerdown', function (e) {
    if (!e.target.closest('.search')) closeSug();
  });

  /* ================= хэш (ссылки вида #room=63А) ================= */
  function roomFromHash() {
    var m = /^room=(.+)$/.exec(decodeURIComponent(location.hash.slice(1)));
    if (!m) return null;
    return allRooms().find(function (r) { return norm(r.number) === norm(m[1]); }) || null;
  }
  window.addEventListener('hashchange', function () {
    var r = roomFromHash();
    if (r && r !== state.selected) { selectRoom(r, { noHash: true }); card.dataset.mode = 'room'; }
    else if (!r && state.selected) clearSelection({ noHash: true });
  });

  /* ================= запуск ================= */
  buildFloorBtns();
  renderLevel();
  var initial = roomFromHash();
  if (initial) { selectRoom(initial, { noHash: true }); card.dataset.mode = 'room'; }
})();
</script>
</body>
</html>
